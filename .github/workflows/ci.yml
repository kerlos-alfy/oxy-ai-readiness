name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-quality:
    name: PHP quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHPCS (coding standards)
        run: composer lint

      - name: PHPStan (static analysis, level 8)
        run: composer analyse

      - name: PHPUnit (unit tests)
        run: composer test

  frontend-quality:
    name: Frontend quality (admin SPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Jest (unit tests)
        run: npm run test

      - name: Vite build
        run: npm run build

  package:
    name: Build and verify distributable package
    runs-on: ubuntu-latest
    needs: [php-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify the package (tests/Integration/PackagingTest.php)
        run: composer test:integration

      - name: Build release package
        run: bash bin/build-release.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxy-ai-readiness-plugin
          path: build/*.zip
          if-no-files-found: error
